<html>

<head>
    <title></title>
</head>

<body>
    <h1 align="center">Student Registration</h1>
    <table cellspacing="10px" align="center">
        <form>
            <tr>
                <td>
                    <label for="">Full Name</label>
                </td>
                <td>
                    <input type="text" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email</label>
                </td>
                <td>
                    <input type="email" id="email" title="Email to nakh mara bhai" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Mobile number</label>
                </td>
                <td>
                    <select style="width: 75px;">
                        <option disabled>Select your timezone</option>
                        <option>+91(India)</option>
                        <option>+1(USA)</option>
                        <option>+44(UK)</option>
                    </select>
                    <input type="tel" pattern="[0-9]{10}">
                </td>

            </tr>
            <tr>
                <td>
                    <label for="">Address</label>
                </td>
                <td>
                    <textarea rows="14" cols="20"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Nationality</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Date Of Birth</label>
                </td>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender</label>
                </td>
                <td>
                    Male<input type="radio" name="g" id="">
                    Female<input type="radio" name="g" id="">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Highest Degree</label>
                </td>
                <td>
                    <select>
                        <option disabled>Select Degree</option>
                        <option>B.Tech</option>
                        <option>MBA</option>
                        <option>BCA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">CPI</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">University</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Passing Year</label>
                </td>
                <td>
                    <select>
                        <option disabled>Select your Passing Year</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">SUBMIT</button>
                </td>
                <td>
                    <button type="reset">RESET</button>
                </td>
            </tr>


        </form>

    </table>
</body>

</html>
